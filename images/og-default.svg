<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F3A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162e54;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a50e25;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Red top bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#redAccent)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Large faded CGEC watermark -->
  <text x="900" y="520" font-family="Georgia, serif" font-size="280" font-weight="700"
        fill="rgba(255,255,255,0.04)" text-anchor="middle" letter-spacing="-8">CGEC</text>

  <!-- Left logo mark block -->
  <rect x="72" y="220" width="80" height="80" fill="#C8102E" rx="2"/>
  <text x="112" y="265" font-family="Georgia, serif" font-size="22" font-weight="700"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CGEC</text>
  <circle cx="112" cy="280" r="3" fill="#FFFFFF" opacity="0.6"/>

  <!-- Main headline -->
  <text x="72" y="360" font-family="Georgia, 'Times New Roman', serif"
        font-size="56" font-weight="600" fill="#FFFFFF" letter-spacing="-1">
    Canada Global Export Council
  </text>

  <!-- Gold divider -->
  <rect x="72" y="385" width="120" height="2" fill="#B8972A"/>

  <!-- Subheading -->
  <text x="72" y="430" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="300" fill="rgba(255,255,255,0.65)">
    Opening Global Markets for Canadian Business
  </text>

  <!-- Market flags row -->
  <text x="72" y="490" font-family="Arial, sans-serif" font-size="20"
        fill="rgba(255,255,255,0.5)">
    🇬🇧 United Kingdom   |   🇪🇺 European Economic Area   |   🇮🇳 India
  </text>

  <!-- EICBI badge -->
  <rect x="72" y="520" width="520" height="44" fill="rgba(184,151,42,0.12)"
        stroke="#B8972A" stroke-width="1" rx="2"/>
  <text x="90" y="548" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#B8972A" letter-spacing="0.5">
    Exclusive Partner of EICBI - EU Transparency Register No. 423661050520-44
  </text>

  <!-- Website URL bottom right -->
  <text x="1128" y="600" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="rgba(255,255,255,0.4)" text-anchor="end" letter-spacing="1">
    cgec.ca
  </text>
</svg>
