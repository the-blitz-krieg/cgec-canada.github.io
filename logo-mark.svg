<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <clipPath id="logoClip">
      <polygon points="0,0 200,0 200,180 170,220 0,220"/>
    </clipPath>
  </defs>
  <!-- Navy background with angled cut -->
  <rect width="200" height="220" fill="#0B1F3A" clip-path="url(#logoClip)"/>
  <!-- Top red accent bar -->
  <rect x="0" y="0" width="200" height="8" fill="#C8102E" clip-path="url(#logoClip)"/>
  <!-- CGEC primary text -->
  <text x="100" y="110" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="3">CGEC</text>
  <!-- Gold divider line -->
  <line x1="24" y1="128" x2="176" y2="128" stroke="#B8972A" stroke-width="1.5"/>
  <!-- Sub text -->
  <text x="100" y="152" font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="400" fill="#B8972A"
        text-anchor="middle" letter-spacing="4">CANADA</text>
  <!-- Gold maple accent dot -->
  <circle cx="100" cy="172" r="4" fill="#B8972A"/>
</svg>
