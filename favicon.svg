<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="clip">
      <polygon points="0,0 100,0 100,85 85,100 0,100"/>
    </clipPath>
  </defs>
  <!-- Navy background with clipped corner -->
  <rect width="100" height="100" fill="#0B1F3A" clip-path="url(#clip)"/>
  <!-- CGEC text -->
  <text x="50" y="52" font-family="Georgia, serif" font-size="22" font-weight="700"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CGEC</text>
  <!-- Gold maple dot -->
  <circle cx="50" cy="66" r="3.5" fill="#B8972A"/>
</svg>
